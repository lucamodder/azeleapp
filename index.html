<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#F6F4EE;--card:#fff;--ink:#17302B;--muted:#64756F;--line:#E5E0D4;--teal:#0F8A6F;--teal-d:#0B6A55;--teal-l:#E2F4EE;--gold:#F4B400;--gold-d:#C48F00;--gold-l:#FFF4D2;--red:#E0504F;--red-d:#B53A39;--red-l:#FDEBEA;--blue:#2F6FD6;--blue-l:#E6EFFC;--teal-t:#0B6A55;--red-t:#B53A39;--r:18px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh;min-height:100dvh}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}h1{font-size:1.6rem}h2{font-size:1.22rem}h3{font-size:1.05rem}
p{margin:.3em 0 .8em}a{color:var(--teal)}
.muted{color:var(--muted)}.small{font-size:.86rem}.center{text-align:center}.mt{margin-top:14px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 18px;font:inherit;font-weight:800;font-size:.98rem;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d);transition:transform .05s;text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 4px 0 var(--gold-d)}
.btn.ghost{background:#fff;color:var(--teal);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn[disabled]{background:#E4E1D8;color:#A39E91;box-shadow:0 4px 0 #CFCABD;cursor:not-allowed;transform:none}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:.78rem;border-radius:12px}
.btn+.btn{margin-top:12px}
.link{background:none;border:0;color:var(--teal);font:inherit;font-weight:700;cursor:pointer;padding:6px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.gold{background:var(--gold-l);border-color:#F2DC94}
.card.teal{background:var(--teal-l);border-color:#BFE6D8}
.card.blue{background:var(--blue-l);border-color:#C7DAF7}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:800;background:var(--teal-l);color:var(--teal-t)}
.pill.gold{background:var(--gold-l);color:#7a5a00}.pill.red{background:var(--red-l);color:var(--red-t)}.pill.gray{background:#EEEBE3;color:var(--muted)}
label.f{display:block;font-weight:700;font-size:.88rem;margin:12px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:1rem;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
textarea{min-height:90px;resize:vertical}
.seg{display:flex;background:#EAE6DB;border-radius:14px;padding:4px;gap:4px}
.seg label,.seg button{flex:1;text-align:center;padding:10px 6px;border-radius:11px;font-weight:800;font-size:.85rem;cursor:pointer;color:var(--muted);border:0;background:none;font-family:inherit}
.seg input{display:none}
.seg input:checked+span,.seg .on{color:var(--ink)}
.seg label:has(input:checked),.seg button.on{background:#fff;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.err{color:var(--red-t);font-weight:700;font-size:.9rem;margin-top:10px;min-height:1em}
/* top & nav */
.top{position:sticky;top:0;z-index:5;background:rgba(246,244,238,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:2px solid var(--line)}
.logo{font-weight:900;font-size:1.15rem;color:var(--teal-t);display:flex;align-items:center;gap:6px}
.logo b{background:var(--gold);color:#3b2a00;border-radius:8px;padding:0 6px}
.stats{display:flex;gap:12px}
.stat{display:flex;align-items:center;gap:3px;font-weight:900;font-size:.95rem}
.stat.fire{color:#E8590C}.stat.xp{color:var(--blue)}.stat.coin{color:var(--gold-d)}
main{padding:16px 16px calc(125px + env(safe-area-inset-bottom))}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:2px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:800;padding:6px 0 5px;border-radius:12px;margin:0 2px}
.nav a .i{display:block;font-size:1.45rem;line-height:1.25;filter:grayscale(1);opacity:.65}
.nav a.on{color:var(--teal-t);background:var(--teal-l)}.nav a.on .i{filter:none;opacity:1}
/* path */
.unit{margin:4px 0 30px}
.unit-h{border-radius:var(--r);padding:16px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);margin-bottom:22px;background:var(--c)}
.unit-h small{opacity:.85;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.72rem}
.unit-h h2{margin:2px 0 4px;font-size:1.25rem}
.unit-h .tag{display:inline-block;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px;font-size:.76rem;font-weight:700;margin-top:6px}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:12px}
.nwrap{display:flex;flex-direction:column;align-items:center}
.node{width:78px;height:72px;border-radius:50%;border:0;font-size:1.9rem;cursor:pointer;position:relative;background:var(--c);box-shadow:0 7px 0 var(--cd);color:#fff;font-family:inherit}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--cd)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.locked{background:#E2DED3;box-shadow:0 7px 0 #C9C4B6;cursor:default;font-size:1.5rem}
.node.cur::after{content:'START';position:absolute;top:-36px;left:50%;transform:translateX(-50%);background:#fff;color:var(--cd);border:2px solid var(--line);padding:3px 10px;border-radius:10px;font-size:.72rem;font-weight:900;animation:bob 1.4s ease-in-out infinite;white-space:nowrap}
.node.hw::before{content:'📌';position:absolute;right:-8px;top:-6px;font-size:1.1rem}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.nlbl{font-size:.8rem;font-weight:800;color:var(--muted);text-align:center;margin-top:12px;max-width:170px}
/* run */
.run{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.run-top{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;font-size:1.7rem;color:var(--muted);cursor:pointer;padding:2px 6px;line-height:1}
.bar{flex:1;height:16px;background:#E4E0D5;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .35s}
.bar.gold>i{background:var(--gold)}
.bar.sm{height:10px}
.run-body{flex:1;padding:24px 0}
.q-k{font-size:.78rem;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.q{font-size:1.28rem;font-weight:800;margin-bottom:20px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:1rem;font-weight:700;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 16px;margin-bottom:11px;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--blue);background:var(--blue-l);color:#1d4fa0}
.opt.right{border-color:var(--teal);background:var(--teal-l);color:var(--teal-t)}
.opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-t)}
.opt[disabled]{cursor:default}
.run-foot{position:sticky;bottom:0;margin:0 -16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--line);background:var(--bg)}
.run-foot.ok{background:var(--teal-l);border-color:#BFE6D8}
.run-foot.bad{background:var(--red-l);border-color:#F5C9C7}
.fb-t{font-weight:900;font-size:1.2rem;margin-bottom:4px}
.ok .fb-t{color:var(--teal-t)}.bad .fb-t{color:var(--red-t)}
.fb-x{font-size:.95rem;margin-bottom:14px}
.ok .btn{background:var(--teal)}.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.tipcard{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:18px;font-size:1.05rem}
.big-emoji{font-size:4rem;text-align:center;margin:10px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.tile{border:2px solid var(--line);border-radius:16px;overflow:hidden;text-align:center;background:#fff}
.tile b{display:block;font-size:.7rem;text-transform:uppercase;padding:5px;color:#fff;background:var(--tc,var(--teal))}
.tile span{display:block;font-size:1.3rem;font-weight:900;padding:10px 4px}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.li:last-child{border-bottom:0}
.msgs{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.bub{max-width:80%;align-self:flex-start;background:#fff;border:2px solid var(--line);border-radius:18px 18px 18px 6px;padding:8px 12px;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--teal);border-color:var(--teal);color:#fff;border-radius:18px 18px 6px 18px}
.bub .who{font-size:.72rem;font-weight:800;color:var(--muted);margin-bottom:2px;white-space:normal}
.bub .tm{font-size:.65rem;opacity:.7;text-align:right;margin-top:2px}
.chatbar{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0}
.unread{background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;font-weight:800;padding:2px 8px;flex:none}
.nav a{position:relative}.nav .bd{position:absolute;top:1px;left:56%;background:var(--red);color:#fff;border-radius:999px;font-size:.62rem;padding:0 5px;line-height:1.5}
a.li{text-decoration:none;color:inherit}
.av{width:46px;height:46px;border-radius:50%;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex:none}
.av.lg{width:92px;height:92px;font-size:3.2rem;margin:0 auto 8px;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.rank{width:26px;font-weight:900;color:var(--muted);text-align:center;flex:none}
.li.me{background:var(--gold-l);margin:0 -16px;padding:12px 16px;border-radius:12px}
.metrics{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;font-weight:700;color:var(--muted);margin-top:2px}
.sitgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sit{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);position:relative}
.sit .e{font-size:2rem}.sit h3{font-size:.95rem;margin:6px 0 6px}
.sit .ck{position:absolute;right:10px;top:10px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 42px;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{text-align:center;font-size:.68rem;font-weight:800;color:var(--muted)}
.bdg i{display:flex;align-items:center;justify-content:center;width:58px;height:58px;margin:0 auto 4px;border-radius:50%;font-style:normal;font-size:1.8rem;background:var(--gold-l);border:3px solid var(--gold)}
.bdg.off i{filter:grayscale(1);opacity:.35;background:#EEE;border-color:#DDD}
.hero{background:linear-gradient(150deg,#0F8A6F,#0B5D4B);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 6px 0 #084536;position:relative;overflow:hidden}
.hero .amt{font-size:2.6rem;font-weight:900;line-height:1.1;margin:6px 0}
.hero .coin{position:absolute;right:-14px;top:-14px;font-size:6rem;opacity:.25;transform:rotate(-12deg)}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar>i{background:var(--gold)}
.avpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avpick button{font-size:1.9rem;padding:8px 0;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;position:relative}
.avpick button.on{border-color:var(--teal);background:var(--teal-l)}
.avpick button.lock{opacity:.45}
.avpick button small{position:absolute;bottom:1px;right:4px;font-size:.6rem;font-weight:900;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font-size:1.45rem;font-weight:900}
.kpi span{font-size:.75rem;font-weight:700;color:var(--muted)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.6rem;font-weight:900;letter-spacing:.18em;background:#fff;border:2px dashed var(--teal);border-radius:12px;padding:6px 12px;display:inline-block}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:50;transition:transform .3s;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.on{transform:translate(-50%,0)}
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(10,30,25,.45)}
#sheet .pane{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,100%)}}
.landing{padding:calc(36px + env(safe-area-inset-top)) 22px 30px;min-height:100vh;display:flex;flex-direction:column}
.landing .mascot{font-size:5rem;text-align:center;margin:18px 0 6px}
.feat{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
.feat i{font-style:normal;font-size:1.6rem;flex:none}
.demo{display:flex;gap:8px;flex-wrap:wrap}
.hr{height:2px;background:var(--line);margin:16px 0}

/* ===== temă întunecată ===== */
:root[data-theme=dark]{--bg:#0E1513;--card:#17211E;--ink:#E7EFEC;--muted:#93A6A0;--line:#2A3833;--teal:#17A583;--teal-d:#0C7259;--teal-l:#12362E;--teal-t:#4FD9B3;--gold-l:#3A3115;--red-l:#3D1E1E;--red-t:#F28C8B;--blue:#6A9CF0;--blue-l:#17263F;color-scheme:dark}
[data-theme=dark] .btn.ghost,[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea,[data-theme=dark] .seg label:has(input:checked),[data-theme=dark] .seg button.on,[data-theme=dark] .nav,[data-theme=dark] .node.cur::after,[data-theme=dark] .opt,[data-theme=dark] .tipcard,[data-theme=dark] .tile,[data-theme=dark] .bub,[data-theme=dark] .sit,[data-theme=dark] .avpick button,[data-theme=dark] .kpi,[data-theme=dark] .code{background:var(--card)}
[data-theme=dark] .bub.me{background:var(--teal)}
[data-theme=dark] .seg{background:#0A100E}

[data-theme=dark] .card.gold{border-color:#5A4A1C}[data-theme=dark] .card.teal{border-color:#1E5547}[data-theme=dark] .card.blue{border-color:#27406A}
[data-theme=dark] .pill.gold{color:#F4CF6A}[data-theme=dark] .pill.gray{background:#24302C}
[data-theme=dark] .node.locked{background:#2A3532;box-shadow:0 7px 0 #1C2523}
[data-theme=dark] .bar{background:#24302C}
[data-theme=dark] .opt.sel{color:#BCD4FA}
[data-theme=dark] .run-foot.ok{border-color:#1E5547}[data-theme=dark] .run-foot.bad{border-color:#5A2B2B}
[data-theme=dark] .bdg.off i{background:#222;border-color:#333}
[data-theme=dark] .av.lg{border-color:var(--card)}
[data-theme=dark] #toast{background:#E7EFEC;color:#0E1513}

/* ===== bara de jos: „Învață” în mijloc ===== */
.nav a.main{flex:1.2;color:var(--teal-t)}
.nav a.main .i{width:62px;height:62px;margin:-30px auto 2px;border-radius:50%;background:linear-gradient(145deg,#1FC39B,var(--teal) 70%);display:flex;align-items:center;justify-content:center;font-size:1.8rem;filter:none;opacity:1;border:4px solid var(--card);box-shadow:0 5px 0 var(--teal-d),0 10px 22px rgba(15,138,111,.35);transition:transform .15s}
.nav a.main.on{background:none}
.nav a.main.on .i{transform:translateY(-2px);box-shadow:0 5px 0 var(--teal-d),0 0 0 4px var(--gold),0 12px 26px rgba(15,138,111,.45)}
.nav a.main:active .i{transform:translateY(3px);box-shadow:0 2px 0 var(--teal-d)}
.stats{align-items:center}
.topav{width:36px;height:36px;border-radius:50%;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-size:1.25rem;text-decoration:none;border:2px solid var(--line);flex:none}
.topav.on{border-color:var(--teal)}
.topav{position:relative}.topav .bd{position:absolute;top:-5px;right:-6px;background:var(--red);color:#fff;border-radius:999px;font-size:.62rem;font-weight:800;padding:0 5px;line-height:1.55;border:2px solid var(--bg)}
.stats{gap:9px}
.nt{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:2px solid var(--line);text-decoration:none;color:inherit}
.nt:last-child{border-bottom:0}.nt .ic{width:42px;height:42px;border-radius:50%;background:var(--teal-l);display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex:none}
.nt.nou .ic{box-shadow:0 0 0 3px var(--gold)}.nt .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
</style>

<script>

 {id:'u1l1',title:'Ce chiar îți trebuie',emoji:'🧭',tip:'<b>Nevoia</b> = fără ea ai o problemă reală (mâncare, transport la școală, telefon de bază).<br><b>Dorința</b> = îți face viața mai plăcută, dar poate aștepta. Nu e greșit să ai dorințe, important e să le alegi tu, nu impulsul.',qs:[

  {q:'Vrei adidași de 600 lei. Ce întrebare te ajută cel mai mult să decizi?',o:['Îi au și prietenii mei?','Câte săptămâni de bani de buzunar mă costă?','Sunt la reducere?','Arată bine în poze?'],a:1,x:'Transformă prețul în timp. Dacă primești 100 lei pe săptămână, adidașii costă 6 săptămâni.'},
  {q:'Ce înseamnă „regula celor 24 de ore”?',o:['Aștepți o zi înainte de o cumpărătură neplanificată','Cumperi doar în primele 24 de ore ale reducerii','Returnezi orice în 24 de ore','Cheltuiești maximum 24 lei pe zi'],a:0,x:'Multe cumpărături impulsive dispar după o zi. Dacă tot o vrei și mâine, probabil chiar o vrei.'},
  {q:'Telefonul tău merge bine, dar a apărut un model nou. Ce este noul telefon?',o:['Nevoie','Dorință'],a:1,x:'Dacă cel vechi funcționează, cel nou e o dorință. Poți să-l vrei, dar planifică-l.'}]},
 {id:'u1l2',title:'Bugetul 50/30/20',emoji:'🥧',tip:'Un buget simplu: <b>50%</b> nevoi, <b>30%</b> dorințe, <b>20%</b> economii.<br>Trucul care chiar funcționează: <b>pune deoparte întâi</b>, cheltuie după.',qs:[

  {q:'Care este cel mai bun obiectiv de economisire?',o:['Vreau să am bani','Strâng 600 lei pentru căști până în martie, adică 150 lei pe lună','Economisesc când îmi rămâne ceva','Nu mai cheltui nimic'],a:1,x:'Un obiectiv bun are o sumă, un termen și un pas lunar clar.'},

 {id:'u2l2',title:'Abonamente și taxări automate',emoji:'🔁',tip:'O perioadă gratuită de probă devine <b>plată automată</b> dacă nu anulezi. În chestionarul nostru, abonamentele uitate au fost <b>cea mai des întâlnită pățanie</b>, iar 2 elevi nu și-au primit banii înapoi nici după e-mailuri.',qs:[

{id:'u3',title:'Taxele din salariu',emoji:'💼',c:'#0F8A6F',cd:'#0B6A55',tag:'📊 Subiectul nr. 1: 40% dintre elevi nu îl înțeleg',lessons:[

  {q:'Ce sumă ajunge efectiv în contul tău?',o:['Salariul brut','Salariul net','Costul angajatorului','Bonusul'],a:1,x:'Netul e suma care ajunge efectiv la tine.'},
  {q:'Pentru ce plătești CAS (25%)?',o:['Pensia ta de mai târziu','Asigurarea mașinii','Taxa pe telefon','Concediul'],a:0,x:'CAS merge la sistemul public de pensii.'},
  {q:'Pentru ce plătești CASS (10%)?',o:['Pentru sănătate: medic de familie, spital, rețete compensate','Transport în comun','Facultate','Pensie'],a:0,x:'CASS îți dă dreptul la servicii medicale din sistemul public.'},
  {q:'Anunțul spune 5.000 lei brut. Cât primești, aproximativ, net (fără deduceri)?',o:['5.000 lei','4.500 lei','≈ 2.925 lei','≈ 1.500 lei'],a:2,x:'5.000 − 1.250 (CAS) − 500 (CASS) = 3.250. Impozit 10% = 325. Net ≈ 2.925 lei, adică cam 58%.'}]},
 {id:'u3l2',title:'Primul fluturaș de salariu',emoji:'📬',tip:'Regulă rapidă: <b>netul e cam 58–60% din brut</b>. Când discuți un job, întreabă mereu dacă suma e brută sau netă. Salariul minim brut în România e 4.325 lei de la 1 iulie 2026.',qs:[
  {q:'Un angajator îți spune „4.000 lei”. Ce întrebi?',o:['Brut sau net?','Când e pauza?','Am parcare?','Nimic'],a:0,x:'Diferența dintre brut și net e de peste 40%.'},
  {q:'Salariu brut 4.000 lei. Cât e CAS (25%)?',o:['400 lei','1.000 lei','1.400 lei','250 lei'],a:1,x:'25% din 4.000 = 1.000 lei.'},
  {q:'Impozitul de 10% se calculează din:',o:['Tot salariul brut','Brut minus CAS și CASS (și minus deducerea, dacă există)','Salariul net','Bonusuri'],a:1,x:'De aceea impozitul e mai mic decât 10% din brut.'},

 {id:'u4l2',title:'Rate peste rate',emoji:'🧱',tip:'Ratele mici par ușoare, dar <b>mai multe rate deodată se adună</b>. Întârzierile aduc penalități și pot ajunge în Biroul de Credit, iar asta îți îngreunează creditele de mai târziu.',qs:[

 {id:'u6l2',title:'Mituri de pe TikTok',emoji:'📱',tip:'Aproape 1 din 2 elevi din chestionar învață despre bani și de pe social media, iar ei au povestit mai des pățanii (37% față de 20%). Întreabă mereu: <b>cine câștigă din sfatul ăsta?</b>',qs:[

{id:'u7',title:'Siguranța banilor online',emoji:'🛡️',c:'#334E68',cd:'#1F3448',tag:'📊 1 din 4 elevi a pățit deja ceva cu banii',lessons:[

 {id:'u7l2',title:'Cumpărături online inteligente',emoji:'📦',tip:'Înainte să cumperi: <b>recenzii cu poze reale</b>, <b>politica de retur</b>, <b>prețul total</b> cu transport. La Black Friday, compară cu prețul de acum o lună.',qs:[

function cyrb(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
const hashPw=(u,p)=>{const s='c18|'+u.toLowerCase()+'|'+p;return cyrb(s,7)+cyrb(s,1337)};

function outgoing(a){return social.reqs.filter(r=>r.status==='pending'&&r.from_u===a).map(r=>r.to_u)}
function threadMsgs(a,kind,id){return kind==='g'?social.msgs.filter(m=>m.grp===id):social.msgs.filter(m=>!m.grp&&((m.from_u===a&&m.to_u===id)||(m.from_u===id&&m.to_u===a)))}
const readKey=()=>'c18_read_'+(me()||{}).u;
function getRead(){try{return JSON.parse(store.get(readKey())||'{}')}catch(e){return{}}}
function markRead(th,id){const r=getRead();if(!(r[th]>=id)){r[th]=id;store.set(readKey(),JSON.stringify(r))}}
function unreadIn(a,kind,id){const r=getRead();const th=(kind==='g'?'g:':'dm:')+id;return threadMsgs(a,kind,id).filter(m=>m.from_u!==a&&m.id>(r[th]||0)).length}
function unreadDm(a){const r=getRead();return social.msgs.filter(m=>!m.grp&&m.to_u===a&&m.id>(r['dm:'+m.from_u]||0)).length}

 const f=friendsList(u.u).filter(x=>db.users[x]).sort();

async function loadSocial(){
 if(isDemo())return;
 try{
  const [r,m]=await Promise.all([sb.from('friend_requests').select('from_u,to_u,status,created_at'),sb.from('messages').select('id,from_u,to_u,grp,body,created_at').order('id',{ascending:false}).limit(500)]);
  if(r.error||m.error)throw (r.error||m.error);
  social={reqs:r.data,msgs:m.data.reverse(),ok:true};
 }catch(e){social={reqs:[],msgs:[],ok:false};console.warn('Comunitate indisponibilă:',e&&e.message)}
 startRealtime();
}
function startRealtime(){
 if(isDemo()||rtChan||!sb||!cloudUser||!social.ok)return;
 rtChan=sb.channel('c18-social')
  .on('postgres_changes',{event:'*',schema:'public',table:'friend_requests'},()=>{reloadReqs().catch(()=>{})})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{const m=p.new;if(m&&!social.msgs.some(x=>x.id===m.id)){social.msgs.push(m);onIncomingMsg(m);onSocialChange()}})
  .subscribe();
}
function stopRealtime(){if(rtChan&&sb){sb.removeChannel(rtChan)}rtChan=null}
async function reloadReqs(){const r=await sb.from('friend_requests').select('from_u,to_u,status,created_at');if(r.error)return;const ch=JSON.stringify(r.data)!==JSON.stringify(social.reqs);const before=me()?incoming(me().u):[];social.reqs=r.data;if(ch){syncFriends();onNewRequests(before);onSocialChange()}}
async function pollSocial(){
 if(isDemo()||!cloudUser||!social.ok)return;
 const last=social.msgs.reduce((a,m)=>Math.max(a,m.id),0);
 const m=await sb.from('messages').select('id,from_u,to_u,grp,body,created_at').gt('id',last).order('id').limit(200);
 let ch=false;if(!m.error)m.data.forEach(x=>{if(!social.msgs.some(y=>y.id===x.id)){social.msgs.push(x);onIncomingMsg(x);ch=true}});
 if(ch)onSocialChange();
 await reloadReqs();
}
function onSocialChange(){

async function sendRequest(to){

 if(f.role!=='elev')return toast('Poți adăuga doar elevi');
 const rel=relation(u.u,f.u);
 if(rel==='friends')return toast('Sunteți deja prieteni');
 if(rel==='out')return toast('Cererea e deja trimisă');
 if(rel==='in')return acceptRequest(f.u);
 if(!isDemo()){const {error}=await sb.from('friend_requests').insert({from_u:u.u,to_u:f.u});if(error)return toast('Eroare: '+error.message)}

async function acceptRequest(from){

 if(!isDemo()){const {error}=await sb.from('friend_requests').update({status:'accepted'}).eq('from_u',from).eq('to_u',u.u);if(error)return toast('Eroare: '+error.message)}
 r.status='accepted';syncFriends();if(isDemo())save();
 const f=db.users[from];toast(`Tu și ${f?f.name:from} sunteți acum prieteni 🎉`);render();
}
async function removeRel(other,msg){

 if(!isDemo()){const a=await sb.from('friend_requests').delete().eq('from_u',u.u).eq('to_u',other);const b=await sb.from('friend_requests').delete().eq('from_u',other).eq('to_u',u.u);if(a.error||b.error)return toast('Eroare: '+(a.error||b.error).message)}
 social.reqs=social.reqs.filter(x=>!((x.from_u===u.u&&x.to_u===other)||(x.from_u===other&&x.to_u===u.u)));
 syncFriends();if(isDemo())save();if(msg)toast(msg);render();
}
async function sendMessage(kind,id,body){
 const u=me();body=String(body||'').trim().slice(0,500);if(!u||!body)return;
 if(kind==='dm'&&relation(u.u,id)!=='friends')return toast('Puteți vorbi doar dacă sunteți prieteni');
 if(kind==='g'&&!GROUP[id])return;
 const row={from_u:u.u,to_u:kind==='dm'?id:null,grp:kind==='g'?id:null,body};
 if(isDemo()){row.id=social.nextId=(social.nextId||0)+1;row.created_at=new Date().toISOString();social.msgs.push(row);save();render();return}
 const {data,error}=await sb.from('messages').insert(row).select('id,from_u,to_u,grp,body,created_at').single();
 if(error)return toast('Mesajul nu s-a trimis: '+error.message);
 if(!social.msgs.some(x=>x.id===data.id))social.msgs.push(data);
 render();

function notifs(u){
 if(!u||u.role!=='elev')return[];
 const seen=getSeen(),L=[];
 incoming(u.u).forEach(f=>{const p=db.users[f];if(p)L.push({k:'req:'+f,ic:p.avatar,t:`<b>${esc(p.name)}</b> ți-a trimis o cerere de prietenie`,href:'#/friends',act:1})});
 friendsList(u.u).forEach(f=>{const n=unreadIn(u.u,'dm',f);if(!n)return;const p=db.users[f],ms=threadMsgs(u.u,'dm',f),last=ms[ms.length-1];
  L.push({k:'dm:'+f,ic:'💬',t:`<b>${esc(p?p.name:f)}</b>: ${esc(cut(last.body,60))}${n>1?` <span class="muted small">(+${n-1})</span>`:''}`,href:'#/chat/dm/'+encodeURIComponent(f),act:1})});
 social.reqs.filter(r=>r.status==='accepted'&&r.from_u===u.u&&!seen['acc:'+r.to_u]).forEach(r=>{const p=db.users[r.to_u];if(p)L.push({k:'acc:'+r.to_u,ic:p.avatar,t:`<b>${esc(p.name)}</b> ți-a acceptat cererea. Acum puteți vorbi!`,href:'#/chat/dm/'+encodeURIComponent(r.to_u)})});
 const c=classOf(u);if(c)c.hw.forEach(w=>{const done=w.type==='lesson'?!!u.done[w.ref]:!!u.sit[w.ref];if(done)return;const t=w.type==='lesson'?(LES[w.ref]||{}).title:(SIT[w.ref]||{}).t;if(!t)return;

 return L.map(x=>Object.assign(x,{nou:!!x.act||!seen[x.k]}));

const notifCount=u=>notifs(u).filter(x=>x.nou).length;
function updateAppBadge(u){try{if(!navigator.setAppBadge)return;const n=u?notifCount(u):0;n?navigator.setAppBadge(n):navigator.clearAppBadge()}catch(e){}}
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function refreshPushState(){let st='unsupported';try{if(pushSupported()){if(Notification.permission==='denied')st='denied';else{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();st=sub?'on':'off'}}}catch(e){}

 if(isDemo())return toast('Notificările pe telefon merg doar cu un cont online');
 if(!pushSupported()||(isIOS()&&!isStandalone()))return openSheet(`<h2>🔔 Notificări pe telefon</h2>${isIOS()?'<p>Pe iPhone, notificările merg doar după ce instalezi aplicația:</p><ol class="steps"><li>Deschide Capital18 în <b>Safari</b>.</li><li>Apasă <b>Partajează</b> → <b>„Adaugă pe ecranul principal”</b>.</li><li>Deschide Capital18 de pe ecranul principal.</li><li>Intră în 🔔 și apasă din nou <b>Pornește notificările</b>.</li></ol>':'<p>Browserul ăsta nu suportă notificări. Încearcă în Chrome.</p>'}<button class="btn mt" data-a="closesheet">Am înțeles</button>`);

  if(perm!=='granted'){state.pushSt=perm==='denied'?'denied':'off';render();return toast('Notificările nu au fost permise')}
  const reg=await navigator.serviceWorker.ready;

const state={run:null,sitAns:{},fSort:'save',fScope:'friends'};
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
function openSheet(html){$('#sheetpane').innerHTML=html;$('#sheet').classList.add('on')}

function shell(u,inner,tab){

  ?[['class','🏫','Clase'],['learn','📚','Lecții'],['sit','💡','Situații'],['profile',u.avatar,'Profil']]
  :[['sit','💡','Situații'],['capital','🪙','Capital 18'],['learn','📚','Învață',1],['friends','👥','Prieteni'],['community','💬','Chat']];
 const BD=u.role==='elev'?{friends:incoming(u.u).length,community:unreadDm(u.u)}:{};const NC=u.role==='elev'?notifCount(u):0;
 const top=u.role==='profesor'
  ?`<div class="logo">Capital<b>18</b></div><span class="pill">Profesor</span>`
  :`<div class="logo">Capital<b>18</b></div><div class="stats"><span class="stat fire" title="Serie de zile">🔥${streakNow(u)}</span><span class="stat xp" title="XP">⚡${fmt(u.xp)}</span><span class="stat coin" title="Fondul tău virtual">🪙${fmt(u.fund)}</span><a href="#/notif" class="topav${tab==='notif'?' on':''}" aria-label="Notificări">🔔${NC?`<span class="bd">${NC>9?'9+':NC}</span>`:''}</a><a href="#/profile" class="topav${tab==='profile'?' on':''}" aria-label="Profil">${u.avatar}</a></div>`;
 return `<header class="top">${top}</header><main>${inner}</main><nav class="nav">${T.map(([k,i,l,m])=>`<a href="#/${k}" class="${tab===k?'on':''}${m?' main':''}"><span class="i">${i}</span>${BD[k]?`<span class="bd">${BD[k]>9?'9+':BD[k]}</span>`:''}${l}</a>`).join('')}</nav>`;

function render(){

 const app=$('#app');let html,tab=r,full=false;
 if(!u){html=r==='register'?viewRegister():r==='login'?viewLogin():viewLanding();full=true}
 else if(r==='run'&&state.run){html=viewRun();full=true}
 else{
  if(r==='run'||r===''||r==='login'||r==='register'){return go(u.role==='profesor'?'#/class':'#/learn')}
  switch(r){
   case 'learn':html=viewLearn(u);break;
   case 'sit':html=parts[1]&&SIT[parts[1]]?viewSit(u,parts[1]):viewSits(u);break;
   case 'capital':html=u.role==='elev'?viewCapital(u):viewLearn(u);break;
   case 'friends':html=u.role==='elev'?viewFriends(u):viewLearn(u);break;
   case 'community':html=u.role==='elev'?viewCommunity(u):viewLearn(u);break;
   case 'notif':html=u.role==='elev'?viewNotif(u):viewLearn(u);break;
   case 'chat':html=u.role==='elev'?viewChat(u,parts[1],decodeURIComponent(parts[2]||'')):viewLearn(u);tab='community';break;
   case 'profile':html=viewProfile(u);break;
   case 'class':html=u.role==='profesor'?(parts[1]&&db.classes[parts[1]]?viewClass(u,parts[1]):viewClasses(u)):viewLearn(u);if(u.role!=='profesor')tab='learn';break;
   default:return go('#/learn');
  }
 }
 app.innerHTML=full?html:shell(u,html,tab);
 if(location.hash!==lastRoute){window.scrollTo(0,0);lastRoute=location.hash}
 if(r==='chat'&&u)window.scrollTo(0,document.body.scrollHeight);
 if(r==='notif'&&u&&u.role==='elev'){const L=notifs(u).filter(x=>!x.act);if(L.some(x=>x.nou))markSeen(L.map(x=>x.k))}
 updateAppBadge(u);
}

/* ================= RULARE LECȚIE / TEST ================= */
function startLesson(id){const l=LES[id];if(!l)return;state.run={kind:'lesson',id,title:l.title,tip:l.tip,emoji:l.emoji,queue:l.qs.map(shuffleQ),total:l.qs.length,i:0,correct:0,mistakes:0,phase:'tip',sel:null,checked:false,back:location.hash||'#/learn'};go('#/run')}
function startTest(kind){
 let qs=START_REFS.map(([id,i])=>LES[id].qs[i]);
 if(kind==='final'){const rest=ALL.flatMap(l=>l.qs.filter((q,i)=>!START_REFS.some(([a,b])=>a===l.id&&b===i)));qs=qs.concat(shuffle(rest).slice(0,3))}
 state.run={kind,title:kind==='final'?'Testul final „Sunt pregătit”':'Testul de start',queue:shuffle(qs).map(shuffleQ),total:qs.length,i:0,score:0,phase:'tip',sel:null,checked:false,back:location.hash||'#/learn',
  tip:kind==='final'?`${qs.length} întrebări din toate unitățile. Ai nevoie de minimum <b>${PASS} răspunsuri corecte</b>. Nu primești explicațiile decât la final, ca la un test adevărat.`:'7 întrebări rapide. Nu contează dacă greșești: testul arată de unde pornești. Profesorul vede doar scorul clasei, ca să compare cu testul final.',emoji:kind==='final'?'🎓':'🧪'};
 go('#/run');
}
function viewRun(){
 const r=state.run;const isL=r.kind==='lesson';
 if(r.phase==='tip')return `<div class="run"><div class="run-top"><button class="x" data-a="quit" aria-label="Închide">✕</button><div class="bar"><i style="width:0%"></i></div></div><div class="run-body"><div class="big-emoji">${r.emoji}</div><h1 class="center">${esc(r.title)}</h1><div class="tipcard mt"><div class="q-k">${isL?'Pe scurt':'Cum funcționează'}</div>${r.tip}</div></div><div class="run-foot"><button class="btn" data-a="begin">Începe</button></div></div>`;
 if(r.phase==='end')return viewEnd();
 const q=r.queue[r.i];const prog=isL?r.correct/r.total*100:r.i/r.total*100;
 const showAns=r.checked&&isL;
 let foot;
 if(!r.checked)foot=`<div class="run-foot"><button class="btn" data-a="check" ${r.sel==null?'disabled':''}>${isL?'Verifică':'Răspunde'}</button></div>`;
 else if(isL)foot=`<div class="run-foot ${r.ok?'ok':'bad'}"><div class="fb-t">${r.ok?['Corect! 🎉','Excelent! ✨','Bravo! 💪','Exact! 👏'][r.i%4]:'Nu chiar…'}</div><div class="fb-x">${r.ok?'':`Răspuns corect: <b>${esc(q.o[q.a])}</b><br>`}${esc(q.x||'')}</div><button class="btn" data-a="next">Continuă</button></div>`;
 else foot=`<div class="run-foot"><button class="btn" data-a="next">Următoarea</button></div>`;
 return `<div class="run"><div class="run-top"><button class="x" data-a="quit" aria-label="Închide">✕</button><div class="bar ${isL?'':'gold'}"><i style="width:${prog}%"></i></div>${isL?'':`<b class="small">${r.i+1}/${r.total}</b>`}</div>
 <div class="run-body"><div class="q-k">${q.retry?'🔁 Încă o dată':isL?'Alege răspunsul':'Întrebarea '+(r.i+1)}</div><div class="q">${esc(q.q)}</div>
 ${q.o.map((o,i)=>{let c='';if(showAns){if(i===q.a)c='right';else if(i===r.sel)c='wrong'}else if(i===r.sel)c='sel';return `<button class="opt ${c}" data-a="pick" data-i="${i}" ${r.checked?'disabled':''}>${esc(o)}</button>`}).join('')}
 </div>${foot}</div>`;
}
function finishRun(){
 const r=state.run;const u=me();let xp=0,fund=0,head,sub,tiles;
 if(r.kind==='lesson'){
  const first=!u.done[r.id];const perfect=r.mistakes===0;
  if(first){xp=10+(perfect?5:0);fund=10+(perfect?5:0);u.done[r.id]={date:dayKey(),perfect}}else{xp=5;if(perfect)u.done[r.id].perfect=true}
  const acc=Math.round(r.total/(r.total+r.mistakes)*100);
  head=perfect?'Lecție perfectă!':'Lecție terminată!';sub=first?'Ai adăugat bani în Capitalul tău de 18 ani.':'Recapitularea te ajută să ții minte.';
  tiles=[['XP','⚡'+xp,'var(--blue)'],['Fond','🪙+'+fund,'var(--gold-d)'],['Precizie',acc+'%','var(--teal)']];
 }else{
  const res={score:r.score,total:r.total,date:dayKey()};
  if(r.kind==='start'){const firstTime=!u.startTest;u.startTest=res;if(firstTime){xp=5;fund=5}head='Testul de start e gata!';sub='Acum știi de unde pornești. Hai la prima lecție.'}
  else{const passed=r.score>=PASS;const was=u.finalTest&&u.finalTest.passed;res.passed=passed||!!was;u.finalTest=res;if(passed&&!was){xp=50;fund=100}else xp=5;head=passed?'Ești pregătit! 🎓':'Aproape!';sub=passed?'Ai trecut testul final. Certificatul tău e în Capital 18.':`Ai nevoie de ${PASS} răspunsuri corecte. Recapitulează și încearcă din nou.`}
  tiles=[['Scor',r.score+'/'+r.total,'var(--teal)'],['XP','⚡'+xp,'var(--blue)'],['Fond','🪙+'+fund,'var(--gold-d)']];
 }
 const nb=award(u,xp,fund);save();
 r.phase='end';r.res={head,sub,tiles,nb,emoji:r.kind==='final'&&r.score<PASS?'💪':r.kind==='lesson'&&r.mistakes===0?'🏆':'🎉',review:r.kind!=='lesson'?r.log:null};
}
function viewEnd(){const s=state.run.res;return `<div class="run"><div class="run-body center"><div class="big-emoji">${s.emoji}</div><h1>${s.head}</h1><p class="muted">${s.sub}</p>
 <div class="tiles">${s.tiles.map(([a,b,c])=>`<div class="tile" style="--tc:${c}"><b>${a}</b><span>${b}</span></div>`).join('')}</div>

 }

 demo(el){store.set(MODE_KEY,'demo');loadDb();const u=db.users[el.dataset.u];if(u)doLogin(u)},

  if(r.kind==='lesson'){if(r.ok)r.correct++;else{r.mistakes++;r.queue.push(Object.assign(shuffleQ(LES[r.id].qs.find(x=>x.q===q.q)),{retry:true}))}}
  else{if(r.ok)r.score++;(r.log=r.log||[]).push({q:q.q,ok:r.ok,right:q.o[q.a]});r.i++;r.sel=null;r.checked=false;if(r.i>=r.queue.length)finishRun();render();return}
  if(navigator.vibrate)try{navigator.vibrate(r.ok?15:[30,40,30])}catch(e){}
  render()},

/* ================= CONTURI ONLINE ================= */
function busy(form,on,label){const b=document.querySelector(`form[data-f=${form}] button`);if(b){b.disabled=on;if(label)b.textContent=label}}
async function cloudRegister(d,u,role){
 const err=m=>{const e=$('#err');if(e)e.textContent=m};busy('register',true,'Se creează contul…');
 try{
  const email=String(d.email||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('EMAIL');
  const free=await sb.rpc('username_liber',{p_username:u});
  if(free.error)throw free.error;
  if(free.data===false)throw new Error('TAKEN');
  const {data,error}=await sb.auth.signUp({email,password:d.pw,options:{data:{username:u}}});
  if(error)throw error;
  if(!data.session)throw new Error('CONFIRM');
  authId=data.user.id;cloudUser=u;await loadCloud();
  const x=Object.assign(newUser({u,name:d.name.trim().slice(0,30),role,grade:role==='elev'?d.grade:'',pw:'',avatar:role==='profesor'?'🦉':'🦊'}),{pass:null});
  let msg='Cont creat! Bine ai venit 👋';
  const code=(d.code||'').trim().toUpperCase();
  if(role==='elev'&&code){if(db.classes[code])x.classCode=code;else msg='Cont creat, dar codul de clasă nu există. Îl poți pune din Profil.'}
  db.users[u]=x;dirty=true;await pushNow();
  go(role==='profesor'?'#/class':'#/learn');toast(msg);
 }catch(e){
  cloudUser=null;authId=null;const m=String(e&&e.message||e);
  err(m==='CONFIRM'?'Contul a fost creat. Confirmă-l din e-mailul primit, apoi intră în cont.':m==='EMAIL'?'Scrie o adresă de e-mail validă.':m==='TAKEN'?'Numele de utilizator e deja luat.':/already|registered|exists/i.test(m)?'Există deja un cont cu acest e-mail. Intră în cont.':/invalid/i.test(m)&&/email/i.test(m)?'Adresa de e-mail nu e validă.':/fetch|network/i.test(m)?'Nu ne putem conecta. Verifică internetul.':'Eroare: '+m);
  busy('register',false,'Creează contul');
 }
}
async function cloudLogin(u,pw){
 const err=m=>{const e=$('#err');if(e)e.textContent=m};busy('login',true,'Se intră…');
 try{
  if(!u.includes('@'))throw new Error('NEED_EMAIL');
  const {data,error}=await sb.auth.signInWithPassword({email:u,password:pw});
  if(error)throw error;
  authId=data.user.id;cloudUser=userOf(data.user);u=cloudUser;await loadCloud();await ensureProfile(u);
  go(db.users[u].role==='profesor'?'#/class':'#/learn');
 }catch(e){
  cloudUser=null;authId=null;const m=String(e&&e.message||e);
  err(m==='NEED_EMAIL'?'Intră cu adresa de e-mail.':/not confirmed/i.test(m)?'Confirmă-ți întâi contul din e-mailul primit.':/invalid|credentials/i.test(m)?'E-mail sau parolă greșită.':/fetch|network/i.test(m)?'Nu ne putem conecta. Verifică internetul.':'Eroare: '+m);
  busy('login',false,'Intră');
 }
}
const F={
 register(f){const d=Object.fromEntries(new FormData(f));const err=m=>{$('#err').textContent=m};
  const u=(d.u||'').trim().toLowerCase().replace(/^@/,'');
  if(!String(d.name||'').trim())return err('Scrie numele afișat.');
  if(!/^[a-z0-9._]{3,20}$/.test(u))return err('Numele de utilizator: 3–20 caractere, doar litere mici, cifre, punct sau _.');
  if(isDemo()&&db.users[u])return err('Numele de utilizator e deja luat.');
  if((d.pw||'').length<6)return err('Parola trebuie să aibă minimum 6 caractere.');
  if(d.pw!==d.pw2)return err('Parolele nu coincid.');
  const role=d.role==='profesor'?'profesor':'elev';
  if(!isDemo())return cloudRegister(d,u,role);
  const x=newUser({u,name:d.name.trim().slice(0,30),role,grade:role==='elev'?d.grade:'',pw:d.pw,avatar:role==='profesor'?'🦉':'🦊'});
  let msg='Cont creat! Bine ai venit 👋';
  const code=(d.code||'').trim().toUpperCase();
  if(role==='elev'&&code){if(db.classes[code])x.classCode=code;else msg='Cont creat, dar codul de clasă nu există. Îl poți pune din Profil.'}
  db.users[u]=x;save();doLogin(x);toast(msg)},
 login(f){const d=Object.fromEntries(new FormData(f));const u=(d.u||'').trim().toLowerCase().replace(/^@/,'');if(!isDemo())return cloudLogin(u,d.pw||'');const x=db.users[u];
  if(!x||x.pass!==hashPw(u,d.pw||'')){$('#err').textContent='Nume de utilizator sau parolă greșită.';return}doLogin(x)},
 save(f){const u=me();const v=Math.round(+new FormData(f).get('amt'));if(!(v>0))return;const before=goalPct(u);u.savings[monthKey()]=saved(u)+v;const nb=award(u,3,0);save();
  toast(nb.length?`🏅 Insignă nouă: ${nb[0].n}`:goalPct(u)>=100&&before<100?'🎉 Obiectivul lunii e atins!':`+${v} lei în pușculiță 🐷`);render()},
 budget(f){const u=me();const d=new FormData(f);const b=Math.round(+d.get('budget'));if(!(b>0))return;u.budget=b;u.goalPct=+d.get('goal')||20;checkBadges(u);save();closeSheet();toast('Obiectiv salvat');render()},
 challenge(f){const u=me();const d=new FormData(f);const c=CHALLENGES.find(x=>x.id===d.get('id'));if(!c)return;u.ch[c.id]=dayKey();(u.chLog=u.chLog||[]).push({id:c.id,date:dayKey(),text:String(d.get('proof')).slice(0,300)});const nb=award(u,c.xp,c.fund);save();closeSheet();toast(nb.length?`🏅 Insignă nouă: ${nb[0].n}`:`+${c.fund} lei în Capitalul tău 🪙`);render()},
 sendmsg(f){const d=new FormData(f);const inp=f.querySelector('input[name=body]');const b=inp.value;inp.value='';sendMessage(d.get('k'),d.get('id'),b)},
 psearch(f){state.pq=String(new FormData(f).get('q')||'').trim();render()},
 addfriend(f){addFriend(me(),String(new FormData(f).get('u')).trim().toLowerCase().replace(/^@/,''))},
 join(f,retried){const u=me();const code=String(new FormData(f).get('code')).trim().toUpperCase();if(!db.classes[code]&&!isDemo()&&!retried){refresh().then(()=>F.join(f,true)).catch(()=>toast('Verifică internetul'));return}if(!db.classes[code])return toast('Codul nu există. Verifică-l cu profesorul.');u.classCode=code;save();toast('Ai intrat în clasa '+db.classes[code].name);render()},
 newclass(f){const u=me();const name=String(new FormData(f).get('name')).trim();if(!name)return;const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code;do{code=Array.from({length:6},()=>A[Math.floor(Math.random()*A.length)]).join('')}while(db.classes[code]);db.classes[code]={code,name,teacher:u.u,created:dayKey(),hw:[]};save();go('#/class/'+code)},
 hw(f){const d=new FormData(f);const c=db.classes[d.get('code')];const [type,ref]=String(d.get('ref')).split(':');c.hw.push({id:'h'+Date.now(),type,ref,due:d.get('due')});save();toast('Tema a fost adăugată');render()}
};
